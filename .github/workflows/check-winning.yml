name: Check Lotto Winning (Saturday)

on:
  schedule:
    # 토 21:30 KST = 토 12:30 UTC. 지연·미발표 대비로 일 09:00 KST = 일 00:00 UTC에 한 번 더 확인한다.
    # 이미 기록된 회차는 다시 알리지 않는다.
    - cron: '30 12 * * 6'
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      round:
        description: '확인할 회차 (비우면 가장 최근 추첨 회차)'
        required: false
        default: ''
      save:
        description: '결과를 records/에 커밋'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lotto-records
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 계정 Secrets 없이 공개 당첨번호와 커밋된 구매 기록만 사용한다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-live.txt
      - name: Check winning numbers and send one verified Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROUND: ${{ inputs.round }}
          SAVE: ${{ github.event_name == 'schedule' || inputs.save }}
        run: |
          args=(check --records records --diagnostic --notify)
          if [ -n "$ROUND" ]; then args+=(--round "$ROUND"); fi
          if [ "$SAVE" = "true" ]; then args+=(--save); fi
          python -m monitor "${args[@]}"
      - name: Commit draw and winning records
        run: |
          mkdir -p records && git add records/
          if git diff --cached --quiet; then echo "no new records"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record lotto draw result $(TZ=Asia/Seoul date +%F) [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
