name: Balance Notification (Saturday)

on:
  schedule:
    # 토 09:00 KST = 토 00:00 UTC. GitHub 혼잡 시 지연될 수 있다.
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balance-notification
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-live.txt
      - name: Read balance and send one verified Discord notification
        env:
          LOTTO_USERNAME: ${{ secrets.LOTTO_USERNAME }}
          LOTTO_PASSWORD: ${{ secrets.LOTTO_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # 공개 로그에는 진단 코드만 남기고 잔액은 Discord로만 보낸다.
        run: python -m monitor live --diagnostic --notify
